version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: music-diary-db
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary_secret
      POSTGRES_DB: music_diary
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
